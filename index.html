<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGA Mock Draft Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #f59e0b; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; margin-top: 0; margin-bottom: 30px; }
        .section { margin-bottom: 25px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #cbd5e1; }
        select, input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 15px; margin-bottom: 10px; box-sizing: border-box; }
        .pick-card { background: #334155; padding: 18px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #f59e0b; }
        .pick-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 18px; font-weight: bold; color: #facc15; }
        .controls-row { display: grid; grid-template-columns: 1fr 2fr; gap: 15px; }
        button.submit-btn { background: #10b981; color: white; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 20px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        button.submit-btn:hover { background: #059669; }
        .loading { text-align: center; color: #38bdf8; font-style: italic; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 DGA Mock Draft Portal</h1>
        <p class="subtitle">Digital Gridiron Association • Official Challenge</p>
        
        <div class="section">
            <label for="coachSelect">👤 Select Your Discord Username:</label>
            <select id="coachSelect">
                <option value="">-- Loading Members from Sheet1 --</option>
            </select>
        </div>

        <div id="draftContainer">
            <div class="loading">Loading prospects and draft order...</div>
        </div>

        <button class="submit-btn" onclick="submitMockDraft()">🚀 Lock In & Submit Mock Draft</button>
    </div>

    <script>
        // REPLACE WITH YOUR PUBLISHED CSV URLS FROM GOOGLE SHEETS
        const SHEET1_CSV_URL = "YOUR_SHEET1_CSV_URL_HERE";
        const DRAFT_CLASS_CSV_URL = "YOUR_DRAFT_CLASS_CSV_URL_HERE";

        let members = [];
        let prospects = [];
        const totalPicks = 32;

        async function initPortal() {
            try {
                const [membersText, draftText] = await Promise.all([
                    fetch(SHEET1_CSV_URL).then(res => res.text()),
                    fetch(DRAFT_CLASS_CSV_URL).then(res => res.text())
                ]);

                members = parseCSV(membersText);
                
                // SANITIZE PROSPECTS: Keep ONLY Name, Position, and College/School. Strip everything else!
                let rawProspects = parseCSV(draftText);
                prospects = rawProspects.map(p => {
                    let fName = p['FIRST'] || p['First Name'] || '';
                    let lName = p['LAST'] || p['Last Name'] || '';
                    return {
                        name: `${fName} ${lName}`.trim(),
                        pos: (p['POS'] || p['pos'] || '').toUpperCase(),
                        college: p['COLLEGE'] || p['College'] || 'N/A'
                    };
                }).filter(p => p.name !== '');

                populateMembers();
                buildDraftUI();
            } catch (err) {
                console.error("Initialization error:", err);
                document.getElementById('draftContainer').innerHTML = `<p style="color: #ef4444; text-align:center;">⚠️ Error loading spreadsheet data.</p>`;
            }
        }

        function parseCSV(text) {
            let lines = text.split('\n');
            let result = [];
            let headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                let currentLine = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                let obj = {};
                for (let j = 0; j < headers.length; j++) {
                    let val = currentLine[j] ? currentLine[j].trim().replace(/^"|"$/g, '') : '';
                    obj[headers[j]] = val;
                }
                result.push(obj);
            }
            return result;
        }

        function populateMembers() {
            const select = document.getElementById('coachSelect');
            select.innerHTML = '<option value="">-- Choose Your Username --</option>';
            
            members.forEach(m => {
                let username = m['User'] || '';
                let discordId = m['Discord ID'] || '';
                if (username && !username.toUpperCase().includes('[LEFT]')) {
                    let opt = document.createElement('option');
                    opt.value = discordId || username;
                    opt.textContent = username;
                    select.appendChild(opt);
                }
            });
        }

        function buildDraftUI() {
            const container = document.getElementById('draftContainer');
            container.innerHTML = '';

            for (let i = 1; i <= totalPicks; i++) {
                let card = document.createElement('div');
                card.className = 'pick-card';
                card.innerHTML = `
                    <div class="pick-header">
                        <span>Pick #${i}</span>
                    </div>
                    <div class="controls-row">
                        <div>
                            <label>Filter Position:</label>
                            <select id="pos_${i}" onchange="updateProspectDropdown(${i})">
                                <option value="ALL">All Positions</option>
                                <option value="QB">QB</option>
                                <option value="HB">HB</option>
                                <option value="WR">WR</option>
                                <option value="TE">TE</option>
                                <option value="OL">OL</option>
                                <option value="EDGE">EDGE</option>
                                <option value="DL">DL</option>
                                <option value="LB">LB</option>
                                <option value="CB">CB</option>
                                <option value="S">S</option>
                            </select>
                        </div>
                        <div>
                            <label>Select Prospect:</label>
                            <select id="prospect_${i}" onchange="refreshAllDropdowns()">
                                <option value="">-- Select Player --</option>
                            </select>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            }
            refreshAllDropdowns();
        }

        function getSelectedProspects() {
            let selected = new Set();
            for (let i = 1; i <= totalPicks; i++) {
                let val = document.getElementById(`prospect_${i}`).value;
                if (val) selected.add(val);
            }
            return selected;
        }

        function updateProspectDropdown(pickNum) {
            let posFilter = document.getElementById(`pos_${pickNum}`).value;
            let prospectSelect = document.getElementById(`prospect_${pickNum}`);
            let currentVal = prospectSelect.value;
            let takenProspects = getSelectedProspects();

            prospectSelect.innerHTML = '<option value="">-- Select Player --</option>';

            prospects.forEach(p => {
                if (posFilter !== 'ALL' && !p.pos.includes(posFilter)) return;
                if (takenProspects.has(p.name) && p.name !== currentVal) return;

                let opt = document.createElement('option');
                opt.value = p.name;
                opt.textContent = `${p.name} (${p.pos} - ${p.college})`;
                if (p.name === currentVal) opt.selected = true;
                prospectSelect.appendChild(opt);
            });
        }

        function refreshAllDropdowns() {
            for (let i = 1; i <= totalPicks; i++) {
                updateProspectDropdown(i);
            }
        }

        function submitMockDraft() {
            let coach = document.getElementById('coachSelect').value;
            if (!coach) {
                alert("Please select your Discord username!");
                return;
            }

            let predictions = {};
            for (let i = 1; i <= totalPicks; i++) {
                predictions[`Pick ${i}`] = document.getElementById(`prospect_${i}`).value;
            }

            // Here you can send 'predictions' to a webhook or your bot backend
            console.log("Submitted:", coach, predictions);
            alert("🚀 Mock draft locked in successfully!");
        }

        window.onload = initPortal;
    </script>
</body>
</html>
